  <script>
    // 첫 페인트 전에 테마/글자 크기 적용 (깜빡임 방지)
    try {
      var t = localStorage.getItem('wq-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var f = localStorage.getItem('wq-font');
      if (f) document.documentElement.style.setProperty('--fs', f);
      if (localStorage.getItem('wq-motion') === 'reduce') document.documentElement.dataset.motion = 'reduce';
    } catch (e) {}
  </script>
